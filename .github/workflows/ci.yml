name: Verify Asterloom

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asterloom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, source engine, and service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify learning engines and source evidence
        run: npm test
      - name: Verify import, network, and room services
        run: npm run test:server
      - name: Verify desktop bundle isolation rules
        run: npm run test:desktop
      - name: Generate included visual and music assets
        run: npm run assets
      - name: Build the complete portable studio
        run: npm run build
      - name: Build and validate the portable example worlds
        run: |
          npx tsx scripts/build-showcase.ts
          npx tsx scripts/build-laboratories.ts
      - name: Install the browser and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise creation, offline export, progress, and multiplayer
        run: npm run test:e2e
      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-verification
          path: |
            .qa/playwright-report/
            .qa/playwright-results/
            .qa/mobile-player.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the verified portable web build
        uses: actions/upload-artifact@v6
        with:
          name: portable-web-studio
          path: |
            release/Asterloom-Studio.html
            release/examples/*.html
            release/examples/*.learnpack
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 native export and replay
    needs: web
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify source extraction and room services on this operating system
        run: npm run test:server
      - run: npm run assets
      - run: npm run build
      - name: Download verified Tor runtime
        run: node desktop/download-tor.mjs --host
      - name: Package the Windows development application
        run: npm run package:desktop -- --platform=windows
      - name: Test actual Windows creation, restart, game export, play, and remix
        run: node --test desktop/native-smoke.test.mjs
        env:
          ASTERLOOM_NATIVE_SMOKE: '1'
          ASTERLOOM_SMOKE_APP: ${{ github.workspace }}/release/desktop/Asterloom-win32-x64/Asterloom.exe
      - name: Archive the verified Windows bundle
        shell: pwsh
        run: Compress-Archive -Path release/desktop/Asterloom-win32-x64 -DestinationPath release/Asterloom-windows-x64.zip
      - name: Keep the unsigned Windows development bundle
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-development-unsigned
          path: release/Asterloom-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Keep Windows native screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-native-verification
          path: .qa/native-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS native export and replay
    needs: web
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify signing boundaries without accessing private keys
        run: node --test desktop/signing.test.mjs
      - name: Verify source extraction and room services on this operating system
        run: npm run test:server
      - run: npm run assets
      - run: npm run build
      - name: Download verified Tor runtime
        run: node desktop/download-tor.mjs --host
      - name: Package for the runner's actual architecture
        shell: bash
        run: |
          task_arch="$(node -p 'process.arch')"
          if [ "$task_arch" = "arm64" ]; then
            npm run package:desktop -- --platform=mac-arm64
          else
            npm run package:desktop -- --platform=mac-intel
          fi
          echo "ASTERLOOM_SMOKE_APP=$PWD/release/desktop/Asterloom-darwin-$task_arch/Asterloom.app/Contents/MacOS/Asterloom" >> "$GITHUB_ENV"
      - name: Test actual macOS creation, restart, game export, play, and remix
        run: node --test desktop/native-smoke.test.mjs
        env:
          ASTERLOOM_NATIVE_SMOKE: '1'
      - name: Archive the application with executable permissions intact
        shell: bash
        run: |
          task_arch="$(node -p 'process.arch')"
          tar -czf "release/Asterloom-macos-$task_arch.tar.gz" -C release/desktop "Asterloom-darwin-$task_arch"
      - name: Keep the unsigned macOS development bundle
        uses: actions/upload-artifact@v6
        with:
          name: macos-development-unsigned
          path: release/Asterloom-macos-*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Keep macOS native screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-native-verification
          path: .qa/native-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
