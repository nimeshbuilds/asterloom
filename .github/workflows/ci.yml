name: Verify Asterloom

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asterloom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Desktop renderer, source engine, and service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify learning engines and source evidence
        run: npm test
      - name: Verify import, network, and room services
        run: npm run test:server
      - name: Verify desktop bundle isolation rules
        run: npm run test:desktop
      - name: Generate included visual and music assets
        run: npm run assets
      - name: Build the desktop renderer
        run: npm run build
      - name: Build and validate editable example notebooks
        run: |
          npx tsx scripts/build-showcase.ts
          npx tsx scripts/build-laboratories.ts
      - name: Install the browser and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify delayed transcription polling in an actual browser
        run: node --test --test-name-pattern="actual Chromium" desktop/transcription-poll.test.mjs
        env:
          ASTERLOOM_BROWSER_POLL_TEST: '1'
      - name: Exercise creation, learning, progress, and multiplayer
        run: npm run test:e2e
      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-verification
          path: |
            .qa/playwright-report/
            .qa/playwright-results/
            .qa/mobile-player.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the verified example notebooks
        uses: actions/upload-artifact@v6
        with:
          name: example-notebooks
          path: |
            release/examples/*.learnpack
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 native export and replay
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build verified local media decoder and speech runtime
        run: npm run prepare:media -- --platform=windows
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      - name: Transcribe actual MP3 and MP4 locally with Base and Small
        run: node --test server/media.integration.test.mjs
        env:
          ASTERLOOM_MEDIA_INTEGRATION: '1'
          ASTERLOOM_EXPECT_CPU_BACKEND: 'haswell'
      - name: Keep reproducible Windows speech runtime
        uses: actions/upload-artifact@v6
        with:
          name: windows-media-runtime
          path: desktop/vendor/media/
          if-no-files-found: error
          retention-days: 7
      - name: Verify source extraction and room services on this operating system
        run: npm run test:server
      - run: npm run assets
      - run: npm run build
      - name: Download verified Tor runtime
        run: node desktop/download-tor.mjs --host
      - name: Package the Windows development application
        id: native_package
        run: npm run package:desktop -- --platform=windows
      - name: Test actual Windows creation, restart, game export, play, and remix
        id: native_smoke
        run: node --test desktop/native-smoke.test.mjs
        env:
          ASTERLOOM_NATIVE_SMOKE: '1'
          ASTERLOOM_MEDIA_MODELS: ${{ github.workspace }}/.qa/media-build/models
          ASTERLOOM_SMOKE_APP: ${{ github.workspace }}/release/desktop/Asterloom-win32-x64/Asterloom.exe
      # Retain a packaged candidate for diagnosis; a failed smoke still fails this job.
      - name: Archive the packaged unsigned Windows bundle
        id: native_archive
        if: ${{ always() && steps.native_package.outcome == 'success' }}
        shell: pwsh
        run: |
          "Packaged unsigned Windows candidate. Native smoke outcome: ${{ steps.native_smoke.outcome }}. This artifact is diagnostic until the complete native job passes." >> $env:GITHUB_STEP_SUMMARY
          Compress-Archive -Path release/desktop/Asterloom-win32-x64 -DestinationPath release/Asterloom-windows-x64.zip
      - name: Keep the packaged unsigned Windows development bundle
        if: ${{ always() && steps.native_package.outcome == 'success' && steps.native_archive.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-development-unsigned
          path: release/Asterloom-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Keep Windows native screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-native-verification
          path: |
            .qa/native-*.png
            .qa/native-features-*.json
            .qa/media-build/REAL-ASR-RESULTS.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS native export and replay
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build both verified Mac speech runtime slices
        run: npm run prepare:media -- --platform=mac
      - name: Transcribe actual MP3 and MP4 locally with Base and Small
        run: node --test server/media.integration.test.mjs
        env:
          ASTERLOOM_MEDIA_INTEGRATION: '1'
      - name: Verify signing boundaries without accessing private keys
        run: node --test desktop/signing.test.mjs desktop/architectures.test.mjs desktop/credential-store.test.mjs desktop/copy-native-tree.test.mjs
      - name: Verify source extraction and room services on this operating system
        run: npm run test:server
      - run: npm run assets
      - run: npm run build
      - name: Download verified Tor runtime
        run: node desktop/download-tor.mjs --platform=mac
      - name: Package one Universal Mac application
        id: native_package
        shell: bash
        run: |
          npm run package:desktop -- --platform=mac
          echo "ASTERLOOM_SMOKE_APP=$PWD/release/desktop/Asterloom-darwin-universal/Asterloom.app/Contents/MacOS/Asterloom" >> "$GITHUB_ENV"
          echo "ASTERLOOM_SMOKE_ARCH=$(node -p 'process.arch')" >> "$GITHUB_ENV"
      - name: Test actual macOS creation, restart, game export, play, and remix
        id: native_smoke
        run: node --test desktop/native-smoke.test.mjs
        env:
          ASTERLOOM_NATIVE_SMOKE: '1'
          ASTERLOOM_MEDIA_MODELS: ${{ github.workspace }}/.qa/media-build/models
      # Retain a packaged candidate for diagnosis; a failed smoke still fails this job.
      - name: Archive the packaged unsigned Mac bundle with executable permissions intact
        id: native_archive
        if: ${{ always() && steps.native_package.outcome == 'success' }}
        shell: bash
        run: |
          echo "Packaged unsigned Mac candidate. Native smoke outcome: ${{ steps.native_smoke.outcome }}. This artifact is diagnostic until the complete native job passes." >> "$GITHUB_STEP_SUMMARY"
          tar -czf release/Asterloom-macos-universal.tar.gz -C release/desktop Asterloom-darwin-universal
      - name: Keep the packaged unsigned macOS development bundle
        if: ${{ always() && steps.native_package.outcome == 'success' && steps.native_archive.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: macos-development-unsigned
          path: release/Asterloom-macos-*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Keep macOS native screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-native-verification
          path: |
            .qa/native-*.png
            .qa/native-features-*.json
            .qa/media-build/REAL-ASR-RESULTS.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
